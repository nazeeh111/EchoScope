name: Scene dispatch regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Exercise the real command dispatcher without captures
        run: python -m unittest discover -s tests -v
  confocal-save:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install the test-only NumPy binary
        run: "python -m pip install --only-binary=:all: --no-deps numpy==2.5.4"
      - name: Require all three confocal-save methods without skips
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_confocal_save.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 3 or result.skipped or result.expectedFailures or not result.wasSuccessful():
              raise SystemExit('Expected three passing confocal-save methods without skips or expected failures.')
          PY
